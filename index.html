<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CycleNavi Pro</title>

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CycleNavi">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: rgba(28, 28, 30, 0.94);
      --accent: #30d158;
      --accent-warn: #ff453a;
      --accent-blue: #0a84ff;
      --accent-orange: #ff9f0a;
      --text: #ffffff;
      --text-sub: #8e8e93;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: var(--text); }
    #map { width: 100%; height: 100%; z-index: 1; }

    /* 上部HUDエリア */
    #top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #hud-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.12);
    }
    #hud-icon { font-size: 34px; min-width: 40px; text-align: center; }
    #hud-info { flex: 1; overflow: hidden; }
    #hud-distance { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
    #hud-action { font-size: 13px; color: var(--text-sub); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; margin-top: 3px; }
    #off-course-badge {
      display: none;
      background: var(--accent-warn);
      color: white;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* 検索サジェストエリア */
    #search-container { position: relative; width: 100%; }
    #search-box {
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: 12px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    #search-input::placeholder { color: var(--text-sub); }
    .search-btn {
      background: var(--accent-blue);
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 6px 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    #search-suggest-list {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 2000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      padding: 4px 0;
      margin: 0;
      list-style: none;
    }
    .suggest-item {
      padding: 10px 14px;
      font-size: 13px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .suggest-item:last-child { border-bottom: none; }
    .suggest-item:active { background: rgba(255,255,255,0.12); }
    .suggest-icon { font-size: 14px; color: var(--accent-blue); }
    .suggest-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 地点設定パネル */
    #waypoint-panel {
      display: none;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 13px;
    }
    .wp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .wp-title { font-weight: 700; color: var(--accent); }
    .wp-actions { display: flex; gap: 6px; }
    .wp-btn {
      background: #3a3a3c;
      border: none;
      color: #fff;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .wp-btn.primary { background: var(--accent-blue); font-weight: 700; }
    .wp-btn.gps { background: var(--accent); color: #000; font-weight: 700; }
    #wp-list-text { color: var(--text-sub); font-size: 12px; }

    /* 勾配凡例 (右上) */
    #grade-legend {
      position: absolute;
      top: 145px;
      right: 12px;
      z-index: 999;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 10px;
      box-shadow: 0 4px
